server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://api.asgardeo.io/t/bprocess/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # Spring Security JWT / Resource Server
    org.springframework.security.oauth2.jwt: DEBUG
    org.springframework.security.oauth2.server.resource: DEBUG
    # Nimbus JOSE/JWT (shows header/alg/type checks, JWK selection, cache info)
    com.nimbusds.jose: TRACE
    com.nimbusds.jose.proc: TRACE
    com.nimbusds.jose.jwk.source: TRACE
    # HTTP client used by Spring to fetch OIDC/JWKS
    org.springframework.web.client.RestTemplate: DEBUG