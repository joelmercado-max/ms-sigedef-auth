server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://api.asgardeo.io/t/bprocess/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security.oauth2.server.resource: DEBUG
    org.springframework.security.web: DEBUG
    org.springframework.security.oauth2.jwt: TRACE